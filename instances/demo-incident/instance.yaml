# Demo instance: an incident postmortem. Synthetic data, no real service, no personal data.
# Purpose: a complete, runnable, NON-LEGAL instance that proves the engine is domain-free.

instance:
  id: demo_incident
  goal: "Establish the root cause of the checkout outage, provable from the incident record"
  holder: "the service team"
  off_limits: ["customer personal data", "speculation about individuals"]

units:
  - name: log_line
    locator_fields: [host, file, line, ts]
    chunk_size: 200
  - name: change
    locator_fields: [repo, commit, ts]
    chunk_size: 50
  - name: metric_point
    locator_fields: [series, ts]
    chunk_size: 200

fidelity:
  order: [original_log, exported_metric, agent_summary, recollection]
  confirming: [original_log, exported_metric]
  agent_grades: [agent_summary]

status:
  values: [in_window, out_of_window, redacted]
  usable: [in_window]

vocabulary:
  tiers: [0, 1, 2, 3]
  directions: [for_goal, against_goal, mixed, neutral]
  issues: [saturation, dependency, deploy, config, monitoring, capacity]
  targets: [rc_pool_exhaustion, rc_bad_deploy, rc_upstream_timeout]
  roles: [error, warning, metric, change, note]

gates:
  - id: confirmed_needs_source_grade
    table: fact
    field: status
    value: confirmed
    requires:
      - edge: cites
        to: [unit]
        where: "grade IN $confirming AND status IN $usable"
        min: 1
  - id: root_cause_needs_support_and_attack
    table: conclusion
    field: ready
    value: true
    requires:
      - edge: supports
        to: [fact]
        min: 1
      - edge: attacks
        min: 1
    forbids:
      - edge: attacks
        where: "verdict = 'fatal'"
      - edge: attacks
        where: "verdict = 'damaging' AND answered = false"

# Lenses (docs/METHOD.md section 7). A perspective or discipline lens becomes a datastore view
# lens_<name> over label joined to its unit; its standard may be stricter than the base gates, never
# looser (statuses within status.usable, grades within fidelity.confirming); its filter is over label
# fields only. A framework lens files every labelled unit under transcribed frame nodes via the crosswalk.
lenses:
  - name: service_owner
    kind: perspective
    charter: "Owns the service; wants the true cause; hurt by a wrong fix; asks: what changed, what saturated, what would have caught it"
    standard: {status: [in_window]}
    filter: "tier >= 2"
    backing: source
  - name: security
    kind: discipline
    charter: "Thinks in trust boundaries and configuration drift; wants every config or dependency change named; hurt by a cause that hides a control gap"
    standard: {status: [in_window], grade: [original_log]}
    filter: "issues CONTAINS 'config' OR issues CONTAINS 'dependency'"
    backing: prompt
  - name: management
    kind: perspective
    charter: "Decides what to fund next; wants only material that survives review; hurt by noise"
    filter: "tier >= 2"
    backing: prompt
  - name: incident_framework
    kind: framework
    charter: "Files every labelled unit under the review template's headings"
    frame:
      source: "Incident review template v3, section 2"
      nodes: [trigger, propagation, detection, mitigation, prevention]
    crosswalk: {trigger: [deploy, config], propagation: [saturation, dependency, capacity], detection: [monitoring], mitigation: [], prevention: [config, monitoring]}
    backing: source

roles:
  - skill: red-team
    lenses: [service_owner, security, management]
    panel:
      options: [survives, damaged, fatal]
      objection_categories: [evidence, timeline, alternative_cause, blast_radius, prevention, monitoring]
      weighted_seat: null

evaluator:
  regression_file: evals/known_errors.json
  gate_probes: generated
  label_agreement:
    sample_chunks: 2
    adjudicate: true

human_owned: [gates, fidelity, status, evaluator, privacy]

privacy:
  deny_list: "~/.xscholar/denylist.txt"
  providers_allowed: ["the model provider the owner approved"]

# Per-agent datastore credentials (xscholar/access.py): a role SELECTs only `read`, writes only `write`;
# a lens_bound role writes lens-carrying rows only under its own lens; only loader writes labels;
# DELETE is root-only. Gates stay in force for every role.
access:
  roles:
    reader:      {read: [unit, label, fact, conclusion, critique, answer], write: [fact, cites, supports]}
    seat:        {read: [unit, label, fact, conclusion, critique, answer], write: [critique, attacks, answer, answers], lens_bound: true}
    loader:      {read: [unit, label, conclusion], write: [unit, label, bears_on, conclusion]}
    coordinator: {read: [unit, label, fact, conclusion, critique, answer], write: [fact, cites, supports, critique, attacks, answer, answers, conclusion]}

# instance.yaml -- the eight answers, machine-readable. THIS FILE LOADS: `python -m groundworks.config
# instances/_template/instance.yaml` validates it, and the same shape generates the schema, the
# datastore gates, a reject-and-accept probe per rule, the label validator's vocabulary and the lens views.
#
# Copy this folder to instances/<name>/, fill it in (the design-instance skill interviews you), and run
#   python scripts/run_instance.py instances/<name> --memory 8025
# Sections marked HUMAN-OWNED may never be changed by the improvement loop (CLAUDE.md rule 6).

# 1. GOAL: what we are trying to establish, and for whom ("direction" is relative to this holder).
instance:
  id: example_instance                      # [a-z0-9_]+
  goal: "Establish whether <X>, provable from <corpus>."
  holder: "the party or team the directions are relative to"
  off_limits: ["things never argued, claimed or done"]

# 2. UNITS: the smallest citable things, and the locator fields a program must be able to resolve.
units:
  - name: page_line
    locator_fields: [source, page, line]
    chunk_size: 220
  - name: document_page
    locator_fields: [doc_id, page]
    chunk_size: 45
  # chunk_by: <locator field> keeps units sharing that value in one slice (e.g. whole days of messages).

# 3. FIDELITY LADDER, strongest first. HUMAN-OWNED.
#    confirming: the grades that may establish a claim. agent_grades: model output, which never may.
fidelity:
  order: [original, text_extract, agent, recollection]
  confirming: [original, text_extract]
  agent_grades: [agent]

# 4. STATUS AXIS: may the unit be used at all? HUMAN-OWNED.
#    "usable" cannot be every status: "true but unusable" must stay expressible.
status:
  values: [usable, restricted, unusable]
  usable: [usable]

# 5. VOCABULARY: the expert's own categories. tiers ascend from 0 (noise).
vocabulary:
  tiers: [0, 1, 2, 3]
  directions: [for_goal, against_goal, mixed, neutral]
  issues: [issue_a, issue_b]
  targets: [conclusion_1, conclusion_2]     # what a label may bear on
  roles: [role_a, role_b]

# TABLES and EDGES (both optional): the node tables and edge types THIS instance needs, beyond the
# ones the engine ships with (unit, label, fact, conclusion, authority, critique, answer; cites,
# supports, undercuts, attacks, answers, bears_on, relies_on). A declared table gets a schema, a
# PERMISSIONS clause per `access:` role and probe cleanup; a declared edge is usable in a gate clause
# exactly like a built-in one, with the same requires/forbids, where, min and both-ways probes.
# A name that collides with a built-in is refused, and so is an edge whose end is not a table.
# Field shape: `name: string`, or `name: {type: string, one_of: [...], optional: true}`.
# Types: string, int, float, bool, datetime. A field is required unless `optional: true`.
#
# tables:
#   event:
#     fields: {when: string, summary: string}
# edges:
#   mentions:
#     from: unit
#     to: event
#     fields: {stance: {type: string, one_of: [supports, disputes, neutral]}, speaker: {type: string, optional: true}}
#
# Two limits worth knowing before you design around them:
#   * a clause's `where` constrains the row at the FAR END of the edge, never the edge's own fields,
#     so `mentions where stance = 'disputes'` is not expressible today;
#   * a rule's clauses are ANDed, so a rule cannot say "this OR a recorded exception". Record an
#     exception as an edge that carries its reason (see the demo's `preserves{how}`).

# 6. GATES: what the datastore refuses. HUMAN-OWNED.
#    $confirming and $usable expand from the two sections above. Every rule gets both probes.
gates:
  - id: confirmed_needs_source_grade
    table: fact
    field: status
    value: confirmed
    requires:
      - edge: cites
        to: [unit]
        where: "grade IN $confirming AND status IN $usable"
        min: 1
  - id: conclusion_ready
    table: conclusion
    field: ready
    value: true
    requires:
      - edge: supports
        to: [fact]
        min: 1
      - edge: attacks
        min: 1
    forbids:
      - edge: attacks
        where: "verdict = 'fatal'"
      - edge: attacks
        where: "verdict = 'damaging' AND answered = false"

# LENSES (docs/METHOD.md section 7). kind: perspective | discipline | framework.
# backing: prompt | source | graph | calibrated -- how far to trust it. A charter nobody signed stays
#   prompt-backed: claiming more with signed: false is refused.
# standard: may be STRICTER than the base gates (status.usable, fidelity.confirming), never looser.
# filter / order: over label fields only (tier, dir, issues, targets, role, chunk).
# A framework lens needs frame.source (where it was transcribed from), frame.nodes, and a crosswalk
#   from every node to issues of the vocabulary ([] for none).
lenses:
  - name: decision_maker
    kind: perspective
    charter: "Who is looking, what they want, what hurts them, the questions they always ask, their blind spots"
    standard: {status: [usable]}
    filter: "tier >= 2"
    backing: prompt
    signed: false
  - name: adversary
    kind: perspective
    charter: "Everything against the goal, strongest first"
    filter: "dir = 'against_goal'"
    order: "tier DESC"
    backing: prompt
    signed: false
  - name: framework
    kind: framework
    charter: "Files every labelled unit under the authoritative framework in its own words"
    frame:
      source: "authoritative document and location (e.g. guideline section, order page)"
      nodes: [f1, f2]
    crosswalk: {f1: [issue_a], f2: [issue_a, issue_b]}
    backing: prompt
    signed: false

# 7. ROLES: skills generated from templates with this vocabulary.
#    panel: the options each seat must choose from, the objection categories, and the weighted seat
#    (or null). Thresholds default to consensus 2/3, agreement 0.70, dissent_quota 2, and are
#    human-owned; keep them in a settings file and lock with --settings (groundworks/panel/PROTOCOL.md).
roles:
  - skill: red-team
    lenses: [adversary, decision_maker]
    panel:
      options: [survives, damaged, fatal]
      objection_categories: [category_1, category_2]
      weighted_seat: null
  - skill: cold-bench
    lenses: [decision_maker]
    panel:
      options: [outcome_1, outcome_2, outcome_3]
      objection_categories: [category_1, category_2]
      weighted_seat: null

# 8. EVALUATOR. HUMAN-OWNED (entries may be added, never removed or loosened).
evaluator:
  # regression_file: a relative path resolves against THE FOLDER THIS instance.yaml IS IN, not the repository
  # root and not the working directory (groundworks/config.py regression_file_path); an absolute path is taken as it
  # is. The pinned id list beside it (<name>.ids.json) resolves the same way.
  regression_file: evals/known_errors.json
  gate_probes: generated
  label_agreement: {sample_chunks: 2, adjudicate: true}

# OPTIONAL: per-agent datastore credentials (groundworks/access.py). The datastore, not the server,
# enforces these: read = tables the role may SELECT, write = tables it may CREATE/UPDATE/RELATE,
# lens_bound = writes lens-carrying rows only under its own lens. Only loader writes label. DELETE is root-only.
access:
  roles:
    reader:      {read: [unit, document, label, fact, conclusion, critique, answer], write: [fact, cites, supports]}
    seat:        {read: [unit, label, fact, conclusion, critique, answer], write: [critique, attacks, answer, answers], lens_bound: true}
    loader:      {read: [unit, document, label, conclusion], write: [unit, document, label, bears_on, conclusion]}
    coordinator: {read: [unit, document, label, fact, conclusion, critique, answer], write: [fact, cites, supports, critique, attacks, answer, answers, conclusion]}

privacy:
  deny_list: "~/.groundworks/denylist.txt"     # outside the repo; the scan fails closed without it
  providers_allowed: ["the model provider the owner approved"]

# OPTIONAL but strongly advised. What each critique verdict MEANS here. The three names are an engine
# constant; what separates them is a judgement about YOUR risk, so it is yours to write and no role
# may turn it. Leave this out and every role is told, in its own skill, that nobody has defined them.
# Measured on the first real instance: 32 of 53 `fatal` verdicts came from one role mapping its own
# three review options onto these three BY POSITION. Under the readiness gate, `fatal` has no
# `answered` escape, so each of those was permanently terminal.
verdicts:
  fatal: "Nothing could cure this conclusion: no rewrite, no further evidence. It ends the conclusion and has no answered escape."
  damaging: "A real problem that blocks readiness until answered on the record. Anything curable by evidence or a rewrite belongs here."
  survivable: "Recorded so the next reader sees it was considered; it does not block."

# ORIGINALS. HUMAN-OWNED. Every unit links to the exact bytes it was extracted from, kept in this instance's
# content-addressed store (groundworks/originals.py, groundworks/store.py). The adapter yields them from
# `documents()` and names one per unit with `document: <key>` (docs/MODULES.md, adapter `documents()`).
#   required    intake refuses a unit with no original, by name. The default for a new instance.
#   transition  a unit with no original is kept and named in health; for an existing corpus being migrated.
# In both modes nothing without a VERIFIED original can support a gated promotion. Run
# `python -m groundworks.originals verify instance.yaml` after any restore or import.
# spans: how a unit's locator cuts its span out of a text original, so a label's quote is checked against the
# original as well as the extracted text: line: <field> | lines: [from, to] | chars: [start, end] | whole: true.
# A unit type with no span (a scanned page has no text span) is counted as not checkable, never as checked.
originals:
  mode: required
  store: originals
  spans:
    page_line: {line: line}

human_owned: [gates, fidelity, status, evaluator, privacy, verdicts, originals]

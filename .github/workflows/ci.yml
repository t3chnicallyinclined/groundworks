name: ci

# Every step here must be able to go red. Two ways one could not, both measured and both fixed below:
#   - `curl -sSf ... | sh` exits 0 when curl fails, because Actions runs `bash -e` WITHOUT pipefail.
#     SurrealDB was then absent, every database suite raised SkipTest, and `unittest` printed
#     "Ran 0 tests ... OK (skipped=N)" and exited 0 -- so the step named "run every suite" reported
#     success having tested nothing that touches the datastore.
#   - A backgrounded `surreal start &` loses its exit status, and a `curl && break || sleep` loop
#     always exits 0, so a server that never started looked exactly like one that did.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"      # nightly: the FULL mutation registry (docs/TESTING.md s.2)
  workflow_dispatch:          # on demand: the same

defaults:
  run:
    shell: bash -euo pipefail {0}   # pipefail: a failing command inside a pipe fails the step

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the mutation step diffs this change against its base commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SurrealDB (the database suites do not run without it)
        run: |
          curl -sSf https://install.surrealdb.com | sh
          echo "$HOME/.surrealdb" >> "$GITHUB_PATH"

      - name: SurrealDB really is installed
        run: |
          # Without this the install can fail and every database test skips behind a green tick.
          command -v surreal || { echo "NOT EXECUTED: surreal is not on PATH after the install step"; exit 1; }
          surreal version

      - name: Every suite, the license check, the drift check, the mutation lint, the evaluator and the privacy scan
        # --require-db turns a skipped suite, or an evaluator that could not reach a server, into a failure
        # instead of "OK (skipped=N)".
        run: python -m groundworks.cli test --require-db

      - name: The registered breaks for the files this change touched
        # Each break is applied to a COPY of the tree and its named test must go red. Only the breaks whose
        # file this change touched run here; the full registry runs nightly and on demand (job below).
        # A push with no usable base (a new branch, a force push) runs the whole registry rather than none.
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE:-}" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python -m tests.harness.mutate run --from HEAD --changed-since "$BASE"
          else
            echo "no usable base commit for this event; running every registered break"
            python -m tests.harness.mutate run --from HEAD
          fi

      - name: Role skills still match the config they came from
        # the docs arm (check c) needs a doc to read: without one it checks nothing and still exits 0
        run: python -m groundworks.drift instances/demo-incident/instance.yaml instances/demo-incident/skills instances/demo-incident/README.md instances/demo-incident/skills/red-team/SKILL.md

      - name: Gates are no weaker than the committed baseline
        run: |
          # 8040: no test suite owns it (the suites use 8023-8034 and refuse a port already in use).
          surreal start --bind 127.0.0.1:8040 --user root --pass root memory &
          server=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8040/health >/dev/null; then break; fi
            # `&` throws the exit status away, so ask directly whether our server is still alive
            kill -0 "$server" 2>/dev/null || { echo "NOT EXECUTED: the throwaway SurrealDB on 8040 exited"; exit 1; }
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8040/health >/dev/null || { echo "NOT EXECUTED: nothing answered on 8040"; exit 1; }
          python -m groundworks.gates instances/demo-incident/instance.yaml --apply --url http://127.0.0.1:8040/sql --baseline instances/demo-incident/gate_baseline.json
          kill "$server"

      - name: Demo instance end to end
        run: python scripts/run_instance.py instances/demo-incident --memory 8025

  mutations:
    # The full registry: every guard's break, database suites included, serially. Too slow for every push
    # (each database break starts its own server), so it runs nightly and on demand. Exit 1 on any
    # SURVIVED / INVALID / STILLBORN break, 2 on NOT EXECUTED: both fail the job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh
          echo "$HOME/.surrealdb" >> "$GITHUB_PATH"
      - name: SurrealDB really is installed
        run: |
          command -v surreal || { echo "NOT EXECUTED: surreal is not on PATH after the install step"; exit 1; }
      - name: Every registered break
        run: python -m tests.harness.mutate run --from HEAD

[package]
name = "gw-ops"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license.workspace = true
publish.workspace = true
description = "Groundworks operations: registry, journal, knowledge, secret references, run, gate, scaffold"

[lints]
workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "time"] }
toml = "0.9"

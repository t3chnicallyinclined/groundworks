[package]
name = "gw-ops"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license.workspace = true
publish.workspace = true
description = "Groundworks operations: registry, journal, knowledge, secret references, run, gate, scaffold"

[lints]
workspace = true

[dependencies]
gw-core = { path = "../gw-core" }
gw-store = { path = "../gw-store" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "time"] }
toml = "0.9"
wait-timeout = "0.2"

[dev-dependencies]
gw-store = { path = "../gw-store", features = ["testkit"] }

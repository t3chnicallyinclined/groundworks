# must-accept samples. The must-refuse samples are not in this file: refusal::must_refuse() builds them
# at run time from fragments and fresh random bytes, so no key-shaped string is committed to this
# public repo. For the same reason a few pattern strings spell one character as a TOML \u escape; the
# regex each one parses to is byte-identical to gw-security's.


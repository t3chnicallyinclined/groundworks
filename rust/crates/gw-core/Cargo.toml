[package]
name = "gw-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
regex = "1"
# The SurrealDB HTTP /sql endpoint this crate talks to is always plain http:// on localhost
# (db.py's own default, and every caller in this repo); TLS is not a decision this crate needs to make.
ureq = { version = "2", default-features = false }
thiserror = "1"
# decide::QuestionSchema::digest identifies the exact question set a score travelled with;
# scores taken under different schemas are not comparable, so the id must be stable and
# collision-resistant. RustCrypto, no unsafe, no transitive surprises.
sha2 = "0.10"
# Db::query speaks SurrealDB's typed CBOR RPC: over JSON-RPC, 3.1.6 rewrites strings that look like
# record ids (measured 2026-10-25), so bound variables would not stay data.
ciborium = "0.2"

# Tier 1 packaging: one box, self-hosted, no orchestration platform (docs/ROADMAP.md V2-6).
# See README.md "Run with Docker Compose" and docs/LICENSING.md s.1 (SurrealDB's BSL 1.1
# ships with this image and must stay conspicuous).
#
#   docker compose up --build engine            # build, start SurrealDB, run the demo
#   docker compose --profile ops up -d backup    # optional: scheduled `surreal export`
#   docker compose --profile gpu up embed        # optional: placeholder, see below

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.1.6
    command:
      - start
      - --bind
      - 0.0.0.0:8000
      - --user
      - ${SURREAL_USER:-root}
      - --pass
      - ${SURREAL_PASS:-root}
      - rocksdb:/data/db
    volumes:
      - surrealdb_data:/data
    ports:
      # Bound to the loopback interface only by default; change SURREAL_PORT (not this
      # binding) if you need a different host port, and only remove the 127.0.0.1 prefix
      # if you understand you are exposing the database to the network.
      - "127.0.0.1:${SURREAL_PORT:-8000}:8000"
    healthcheck:
      # No shell/curl/wget in this image (see Dockerfile.backup's comment for why); the
      # `surreal` binary's own `is-ready` subcommand is the documented way to probe it,
      # and works as an exec-form healthcheck with no shell involved.
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      XSCHOLAR_DB_URL: http://surrealdb:8000/sql
      XSCHOLAR_INSTANCE: /instances/demo-incident/instance.yaml
    volumes:
      - ./instances:/instances
    # The Dockerfile's ENTRYPOINT is `python -m xscholar.cli` (the one general entrypoint);
    # this service overrides both entrypoint and command so its default run is the demo
    # against the compose database (not --memory), exactly as specified:
    #   python scripts/run_instance.py /instances/demo-incident --url http://surrealdb:8000/sql
    entrypoint: ["python"]
    command: ["scripts/run_instance.py", "/instances/demo-incident", "--url", "http://surrealdb:8000/sql"]

  backup:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile.backup
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      SURREAL_URL: http://surrealdb:8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NS: ${SURREAL_NS:-demo_incident}
      SURREAL_DB: ${SURREAL_DB:-demo_incident}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
    # Runs as root only to guarantee write access to the ./backups bind mount regardless
    # of host directory ownership; this is a local, single-box backup sidecar, not a
    # network-facing service (docs/LICENSING.md's tenant-isolation concerns don't apply).
    user: "0:0"
    restart: unless-stopped

  # GPU profile placeholder (docs/ROADMAP.md V2-6): not built or pulled by default, and
  # deliberately not a CUDA base image (xscholar/embed today runs local/CPU embeddings;
  # torch is an optional extra -- see pyproject.toml `[project.optional-dependencies].embed`
  # and docs/LICENSING.md s.4 for which embedding models are commercially clear).
  # When GPU embedding is adopted: replace this with a real Dockerfile that installs
  # `pip install .[embed]` plus a CUDA-enabled torch wheel, on an nvidia/cuda base image
  # (never pulled here), and add `deploy.resources.reservations.devices` for the GPU.
  embed:
    profiles: ["gpu"]
    image: python:3.13-slim
    command:
      - python
      - -c
      - |
        print("embed (gpu profile) placeholder -- not implemented.")
        print("To wire this up: pip install .[embed] (adds torch, sentence-transformers, numpy)")
        print("on a CUDA-enabled base image, never pulled by this placeholder, and see")
        print("xscholar/embed/ for the retrieval bake-off a GPU model must still beat.")

volumes:
  surrealdb_data:

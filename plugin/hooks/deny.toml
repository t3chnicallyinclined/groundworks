  "curl -XPUT https://api.cloudflare.com/client/v4/zones/$ZONE/settings/ssl -d '{\"value\":\"strict\"}'",
  'curl --json @rec.json https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records',
  'curl -sS -X PATCH https://api.cloudflare.com/client/v4/accounts/$ACC/r2/buckets/x -d {}',
  'wget --method=DELETE https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$ID',
  'http DELETE https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$ID',
]
samples_allow = [
  'curl -s -H "Authorization: Bearer $CF_API_TOKEN" https://api.cloudflare.com/client/v4/zones | jq .result[].name',
  'curl -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?type=MX" -H "Authorization: Bearer $CF_API_TOKEN"',
  'curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CF_API_TOKEN"',
  'curl -X POST https://httpbin.org/post -d x=1',
  'curl -sI https://api.cloudflare.com/client/v4',
  'curl -sS -o /tmp/zones.json https://api.cloudflare.com/client/v4/zones -H "Authorization: Bearer $CF_API_TOKEN"',
  'grep -rn api.cloudflare.com scripts/',
]

[[rule]]
id = "cloudflare-cli-mutate"
action = "deny"
regex = '(?i)\bwrangler\b(?:\s+-{1,2}[\w-]+(?:\s*[= ]\s*\S+)?)*\s+(?:deploy|publish|delete|rollback|versions\s+(?:deploy|upload)|deployments\s+rollback|r2\s+object\s+(?:delete|put)|r2\s+bucket\s+(?:delete|create|update|lifecycle|cors|domain|notification|sippy)|kv:?\s*(?:key|bulk|namespace)\s+(?:delete|put|create|rename)|secret\s+(?:put|delete|bulk)|secrets?\s+(?:put|delete|bulk)|pages\s+(?:deploy|publish|deployment\s+(?:delete|rollback)|project\s+(?:create|delete))|d1\s+(?:create|delete|migrations\s+apply|execute\b[^|;&\n]*--remote)|queues\s+(?:create|delete|purge)|hyperdrive\s+(?:create|delete|update)|vectorize\s+(?:create|delete|insert|upsert)|dispatch-namespace\s+(?:create|delete)|triggers\s+deploy|cert\s+(?:upload|delete)|login|logout)\b|\bcloudflared\s+tunnel\b(?:\s+-{1,2}[\w-]+(?:\s*[= ]\s*\S+)?)*\s+(?:create|delete|route|cleanup|token)\b|\bflarectl\b[^|;&\n]*\b(?:create|update|delete|purge|set)\b|\brclone\s+(?:delete|purge|deletefile|rmdir|rmdirs|move|moveto|sync|copy|copyto|cleanup)\b[^|;&\n]*\b(?:r2|cloudflare)\S*:'
reason = "wrangler deploy/publish/delete, R2 object delete, KV key delete and cloudflared tunnel changes are production edge changes (estate.md) and wait for the owner's go (principle 14): `wrangler dev`, `wrangler tail`, `r2 object get`, `kv key list|get` are fine; deploy via `groundworks run <project> <env> -- wrangler deploy` after the owner's go."
samples_deny = [
  'wrangler deploy',
  'npx wrangler publish --env production',
  'wrangler r2 object delete supergun-telemetry/2026/10/match.jsonl',
  'wrangler kv:key delete --namespace-id abc123 config',
  'wrangler kv key delete --binding CFG config',
  'wrangler secret put CF_TOKEN',
  'wrangler pages deploy ./dist --project-name crewcut',
  'wrangler d1 execute crewcut --remote --command "DELETE FROM clips"',
  'cloudflared tunnel delete rise3-mail',
  'rclone sync ./dist r2:supergun-web/ --delete-excluded',
  'wrangler rollback',
  'bunx wrangler versions deploy',
]
samples_allow = [
  'wrangler dev',
  'wrangler tail sg-telemetry',
  'wrangler r2 object get supergun-telemetry/2026/10/match.jsonl --file /tmp/m.jsonl',
  'wrangler r2 bucket list',
  'wrangler kv key list --binding CFG',
  'wrangler kv:key get --namespace-id abc123 config',
  'wrangler deployments list',
  'wrangler whoami',
  'wrangler d1 execute crewcut --local --command "SELECT count(*) FROM clips"',
  'cloudflared tunnel list',
  'cloudflared tunnel info rise3-mail',
  'rclone ls r2:supergun-telemetry/2026/10/',
  'rclone size r2:supergun-web',
]

# ---------------------------------------------------------------------------------------------------
# F. Groundworks' own gate (cannot be side-stepped from inside the agent)
# ---------------------------------------------------------------------------------------------------

[[rule]]
id = "groundworks-confirm-on-cmdline"
action = "warn"
regex = '(?i)\bgroundworks(?:\.exe)?\b[^|;&\n]*\brun\b[^|;&\n]*--confirm\b'
reason = "--confirm on a protected env repeats the owner's go; it never replaces it (principle 14): only pass --confirm in the same turn the owner said go, and say so in the journal entry that carries the receipt."
samples_deny = [
  'groundworks run supergun prod --confirm yes -- kubectl apply -f k8s/',
  'C:/Users/trist/.cargo/bin/groundworks.exe run mail prod --confirm 2026-10-29 -- helm upgrade stalwart ./chart',
]
samples_allow = [
  'groundworks run supergun dev -- cargo test',
  'groundworks show supergun --limit 10',
  'groundworks run mail prod -- kubectl get pods -n mail',
]

[[rule]]
id = "hook-selfedit"
action = "deny"
regex = '(?i)(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+(?:-[a-zA-Z]*i[a-zA-Z]*|--in-place)\b[^|;&\n]*\s|\b(?:rm|mv|cp)\s+(?:\S+\s+)*)\S*(?:/plugins/cache/groundworks/\S*(?:hooks\.json|deny\.toml|hooks/\S+)|\.claude/settings(?:\.local)?\.json|\.claude/hooks/\S+|/\.groundworks/secrets/\S+|/\.groundworks/groundworks\.toml)|\bGROUNDWORKS_ENFORCE\s*=\s*(?:warn|off|0|false)\b'
reason = "The hooks, the deny list, the HMAC key and settings.json are the enforcement mechanism; an agent editing them is the bypass this layer exists to stop; the owner changes them in his own session (principle 14)."
samples_deny = [
  'echo "{}" > ~/.claude/plugins/cache/groundworks/groundworks/0.3.0/hooks/hooks.json',
  'sed -i "s/deny/warn/" ~/.claude/plugins/cache/groundworks/groundworks/0.3.0/deny.toml',
  'rm ~/.claude/plugins/cache/groundworks/groundworks/0.3.0/hooks/pretooluse.sh',
  'GROUNDWORKS_ENFORCE=warn claude',
  'cp new-settings.json ~/.claude/settings.json',
  'cat key > C:/Users/trist/projects/.groundworks/secrets/hook_hmac.key',
]
samples_allow = [
  'cat ~/.claude/plugins/cache/groundworks/groundworks/0.3.0/hooks/hooks.json',
  'cat ~/.claude/settings.json | jq .hooks',
  'grep -n GROUNDWORKS_ENFORCE C:/Users/trist/projects/.groundworks/groundworks.toml',
  'ls -la C:/Users/trist/projects/.groundworks/secrets/',
  'sed -i "s/foo/bar/" rust/crates/gw-mcp/src/hooks.rs',
]

# deny.toml -- PreToolUse rule list for the Bash tool (Groundworks enforcement, Layer 2)
# Owner of this file: gw-security. Drafted 2026-10-29 for decision 1itizcerhaj5x1mjfyj2 (owner go cgilrpv6ynkwmvu3u929).
# Engineer: copy into the plugin as-is; the selftest must run every samples_deny through its rule
# (expect a match) and every samples_allow (expect no match), and must be able to go red (principle 6).
#
# HOW TO EVALUATE (engineer's hook)
#   1. Take the Bash tool's `command` string verbatim (no shell expansion, no alias resolution).
#   2. Test every rule with action = "deny". First match -> permissionDecision = "deny", reason = rule.reason, log rule.id.
#   3. Otherwise test every rule with action = "warn". First match -> allow, systemMessage = rule.reason, log rule.id.
#   4. Otherwise allow silently.
#   5. If the rule file fails to parse or a regex fails to compile: DENY every Bash call with a visible notice
#      (principle 8: guards fail closed). Do not fall through to allow.
#   6. Mode GROUNDWORKS_ENFORCE=warn downgrades "deny" to "warn" for everything EXCEPT rules with
#      hard = true (the secret-exfiltration rules). Those stay deny in every mode.
#
# REGEX DIALECT
#   Rust `regex` crate. No lookahead, no lookbehind, no backreferences are used anywhere below, so the
#   same patterns run identically under Python `re` (which is what tests/test_deny.py uses).
#   Known divergences, all avoided here: Python `$` also matches before a trailing "\n" (Rust needs (?m));
#   Python supports (?<=...) / (?!...) / \1 (Rust does not); Rust `\b` is Unicode by default (Python 3 str
#   patterns too, so no difference on these inputs). Patterns use \x22 (") and \x27 (') instead of quote
#   characters so they fit in TOML literal strings.
#   Every regex is matched with "search" semantics (match anywhere in the command string).
#
# WHAT THIS IS AND IS NOT
#   This list is a GUARD RAIL, not a security boundary. A regex over a command string is evaded by:
#   quoting and escapes (kube""ctl, k\ubectl), $VAR expansion (CMD=apply; kubectl $CMD), aliases and
#   functions, scripts (bash deploy.sh), heredocs, base64 | sh, python -c, xargs, env -S, a second hop
#   (ssh rise3 then an interactive command), and a different tool (Write a file then ssh ... < file).
#   It stops the honest, hurried path: an agent that types the obvious command. It also makes every stop
#   point at the sanctioned path (`groundworks run <project> <env> ...`, which gives a receipt and, on a
#   protected env, repeats the owner's go with --confirm; principle 14).
#   The ACTUAL boundary is: who holds the ssh key for rise3 (the owner's agent / key file), who holds a
#   kubeconfig that reaches the prod cluster, the Bitwarden session (BW_SESSION is never in the agent's
#   environment), Cloudflare/npm/crates/Expo tokens living only in the registry as references resolved by
#   `groundworks run`, and `confirm` on protected envs. If those are in the agent's reach, this file is
#   advisory. If they are not, this file is mostly a UX layer that names the right path.
#
# KNOWN OVER-REACH (accepted): `git push --help` is denied (use `man git-push`); `kubectl create` and
#   `kubectl exec` warn even when read-only; `helm upgrade --dry-run` and `cargo publish --dry-run` are
#   denied (use helm template / cargo package --list). Each is cheaper than the regex that would exempt it.
#
# HOST NAMES
#   The prod host is matched as the ssh alias `rise3` (knowledge/estate.md). UNKNOWN: whether rise3 is ever
#   addressed by FQDN or IP in agent commands. If it is, add those spellings to the `rise3` alternations
#   (grep this file for \brise3\b). dev0ps is DECOMMISSIONED (estate.md): any ssh to it is denied.
#
# FIELDS
#   id            stable identifier logged in hook_event.rule_id (never the command text)
#   regex         Rust regex, search semantics
#   action        "deny" | "warn"
#   hard          true = stays deny even in GROUNDWORKS_ENFORCE=warn mode (secret exfiltration only)
#   reason        one sentence shown to the agent; names the groundworks run alternative where one exists
#   samples_deny  >= 2 strings that must match
#   samples_allow >= 2 strings that must not match (realistic reads or near-misses)

version = 1
owner = "gw-security"
drafted = "2026-10-29"

# READER EXEMPTION (evaluated before any rule)
#   A command whose FIRST word is one of `reader_exempt.commands` and which contains none of
#   `reader_exempt.forbidden_chars` is allowed without consulting the rules. This is what lets
#   `grep -rn "kubectl apply" docs/` through while `echo "kubectl apply" | ssh rise3` (has a pipe) and
#   `ssh rise3 "grep x" ; kubectl apply` (has a semicolon) still reach the rules. The first word is the
#   command after stripping leading whitespace and any `VAR=value` assignments; a leading `cd X &&` is
#   NOT stripped (it contains &&, so the command goes to the rules, which is the intended behaviour).
[reader_exempt]
commands = ["grep", "rg", "cat", "head", "tail", "less", "wc", "stat", "file", "echo", "printf", "man", "type", "which", "ls", "tree", "find", "fd", "diff", "jq", "yq", "awk", "cut", "sort", "uniq", "tr"]
forbidden_chars = ["|", ";", "&", "`", "$(", ">", "<", "\u000A", "\u000D"]
samples_allow = [
  'grep -rn "kubectl apply" docs/',
  'grep -rn "docker push" .github/',
  'rg "git push" plugin/',
  'cat scripts/deploy.sh',
  'echo kubectl apply -f x.yaml',
]
samples_not_exempt = [
  'echo "kubectl apply -f x" | ssh rise3',
  'grep x file; kubectl apply -f x.yaml',
  'cat deploy.sh | ssh rise3 bash',
  'cd rust && git push',
  'echo ssh-ed25519 AAAA agent >> ~/.ssh/authorized_keys',
  'FOO=1 kubectl apply -f x',
]

# ---------------------------------------------------------------------------------------------------
# A. Secret exfiltration (hard = true; these are the ones that cost a key rotation, 2026-09-19)
# ---------------------------------------------------------------------------------------------------

[[rule]]
id = "kubectl-secret-read"
action = "deny"
hard = true
regex = '(?i)(?:\bkubectl\b|\bmicrok8s(?:\.kubectl|\s+kubectl)\b)[^|;&\n]*\bget\b(?:[^|;&\n]*\bsecrets?\b[^|;&\n]*(?:-o\s*=?\s*|--output\s*[= ]\s*|--template\s*[= ])(?:yaml|json|jsonpath|go-template|custom-columns|template|\x22|\x27|\{)|[^|;&\n]*(?:-o\s*=?\s*|--output\s*[= ]\s*)(?:yaml|json|jsonpath|go-template|custom-columns|template)\S*[^|;&\n]*\bsecrets?\b)|\bkubectl\s+view-secret\b'
reason = "Never read Secret values (estate.md; principle 13): kubectl get secret -o yaml|json|jsonpath prints them into the transcript; inspect metadata with `kubectl get secret X` / `kubectl describe secret X`, and consume the value only through `groundworks run <project> <env> ...`."
samples_deny = [
  'kubectl get secret regcred -n default -o yaml',
  'kubectl get secrets -A -o json',
  "kubectl get secret db-creds -o jsonpath='{.data.password}' | base64 -d",
  'microk8s kubectl get secret cf-token -ojson',
  'kubectl -n mail get -o yaml secret stalwart-admin',
  'ssh rise3 "microk8s kubectl get secret tls-cert -n ingress -o yaml"',
  'kubectl get secret x --output=json',
  'kubectl get secret x --template={{.data.pw}}',
  'kubectl view-secret db-creds password',
]
samples_allow = [
  'kubectl get secrets -n default',
  'kubectl get secret regcred -o wide',
  'kubectl describe secret regcred -n default',
  'kubectl get configmap app-config -o yaml',
  'kubectl get pods -A -o json',
  'ssh rise3 "microk8s kubectl get secret -A"',
  'kubectl get secret x -o name',
  'kubectl get deploy stalwart -o yaml',
]

[[rule]]
id = "kubectl-secret-literal"
action = "deny"
hard = true
regex = '(?i)--from-literal\s*=\s*[\w.\-]+\s*=\s*[^$\s\x22\x27]|--from-literal\s*=\s*[\w.\-]+\s*=\s*[\x22\x27][^$\x22\x27]'
reason = "A secret value on the command line lands in the transcript (principle 13, the 2026-09-19 rotation): write it to a file the agent cannot read back, or use --from-env-file / --from-file under `groundworks run <project> <env> ...` where the registry resolves the bw: reference."
samples_deny = [
  'kubectl create secret generic db --from-literal=password=hunter2 --dry-run=client -o yaml',
  "kubectl create secret generic api --from-literal=token='sk\u005Flive_abc123def456' -n app",
  "kubectl create secret generic x --from-literal=KEY=\"\u0041KIAIOSFODNN7EXAMPLE\"",
]
samples_allow = [
  'kubectl create secret generic db --from-literal=password="$DB_PASS" --dry-run=client -o yaml',
  "kubectl create secret generic db --from-literal=password=$DB_PASS",
  'kubectl create secret generic db --from-env-file=/run/secrets/db.env --dry-run=client -o yaml',
  'kubectl create secret generic db --from-file=password=/run/secrets/db.pw',
]

[[rule]]
id = "bw-read"
action = "deny"
hard = true
regex = '(?i)\bbw\b(?:\s+-{1,2}[\w-]+(?:\s*[= ]\s*\S+)?)*\s+(?:get\s+(?:item|password|username|totp|notes|uri|attachment|exposed)\b|list\s+items\b|export\b|unlock\b|login\b|serve\b|share\b|generate\b)|\brbw\b(?:\s+-{1,2}[\w-]+(?:\s*[= ]\s*\S+)?)*\s+(?:get|code|edit|add|generate|unlock|login)\b'
reason = "Bitwarden values never pass through the agent (principle 13): reference them as bw:ITEM#FIELD in the registry and use them through `groundworks run <project> <env> ...`; look item names up in the vault UI, not with bw list items (its JSON carries every password)."
samples_deny = [
  'bw get password "rise3 root"',
  'bw get item 3f2c1a-rise3 --raw',
  'bw list items --search cloudflare | jq -r ".[].login.password"',
  'bw export --format json --output vault.json',
  'bw --session "$BW_SESSION" get totp github',
  'bw unlock --raw',
  'rbw get rise3',
  'bw list items | jq -r ".[].name"',
]
samples_allow = [
  'bw status',
  'bw sync',
  'bw list folders',
  'bw list collections --pretty',
  'bw get fingerprint',
  'bw lock',
  'bw --version',
  'cat README.md | grep -i "bw:"',
  'echo "see bw:rise3 server#root password"',
]

[[rule]]
id = "literal-token-on-cmdline"
action = "deny"
hard = true
regex = '(?i)(?:\b(?:BW_SESSION|CLOUDFLARE_API_TOKEN|CF_API_TOKEN|CF_API_KEY|GITHUB_TOKEN|GH_TOKEN|NPM_TOKEN|CARGO_REGISTRY_TOKEN|AWS_SECRET_ACCESS_KEY|EXPO_TOKEN|EAS_TOKEN|GROUNDWORKS_OWNER_PASS|GROUNDWORKS_DB_PASS|KUBE_TOKEN|DOCKER_PASSWORD)\s*=\s*[\x22\x27]?[A-Za-z0-9_\-./+=]{16,}|Authorization:\s*(?:Bearer|Basic|token)\s+[A-Za-z0-9_\-./+=]{20,}|\b(?:sk_live|sk_test|ghp|github_pat|glpat|xox[abpr])_[A-Za-z0-9_\-]{10,}|\b\x41KIA[0-9A-Z]{16}\b|\bey\x4A[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}|--password\s*(?:=|\s)\s*[^$\s\x22\x27-][^\s]*|-p\s*[^$\s\x22\x27-][^\s]{6,}\s+(?:-h|--host|-u|--user))'
reason = "A literal token or password in a command line is a secret in the transcript (principle 13, the 2026-09-19 rotation): pass it as $VAR from the registry via `groundworks run <project> <env> ...`, never as a value."
samples_deny = [
  'export CLOUDFLARE_API_TOKEN=aB3dEfGhIjKlMnOpQrStUvWxYz012345',
  'curl -H "Authorization: Bearer v1.0abcdefghijklmnopqrstuvwxyz0123456789" https://api.cloudflare.com/client/v4/zones',
  "echo gh\u0070_abcdefghijklmnopqrstuvwxyz0123456789 | gh auth login --with-token",
  'docker login -u deploy --password hunter2hunter2 ghcr.io',
  'BW_SESSION="aGVsbG8gd29ybGQgdGhpcyBpcyBhIHNlc3Npb24=" bw sync',
  "aws configure set aws_access_key_id \u0041KIAIOSFODNN7EXAMPLE",
  "curl -H \"Authorization: Bearer ey\u004AhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ey\u004AzdWIiOiIxMjM0NTY3ODkwIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c\" https://x.test",
]
samples_allow = [
  'curl -H "Authorization: Bearer $CF_API_TOKEN" https://api.cloudflare.com/client/v4/zones',
  'export CLOUDFLARE_API_TOKEN="$(cat /run/secrets/cf)"',
  'BW_SESSION="$BW_SESSION" bw sync',
  'docker login -u deploy --password-stdin ghcr.io < /run/secrets/ghcr',
  'grep -rn "GITHUB_TOKEN" .github/workflows/',
  'echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}"',
  'mysql -h localhost -u root -p',
  'git log --oneline -p',
]

# ---------------------------------------------------------------------------------------------------
# B. Production host (ssh rise3): mutations denied, reads pass with a notice
# ---------------------------------------------------------------------------------------------------

[[rule]]
id = "ssh-dev0ps"
action = "deny"
regex = '(?i)\b(?:ssh|scp|rsync|sftp)\b[^|;&\n]*\bdev0ps\b'
reason = "dev0ps (Hetzner) is DECOMMISSIONED (knowledge/estate.md): never ssh to it; prod is rise3 and its commands go through `groundworks run <project> prod ...`."
samples_deny = [
  'ssh dev0ps uptime',
  'ssh root@dev0ps "df -h"',
  'scp backup.tgz dev0ps:/root/',
]
samples_allow = [
  'ssh rise3 uptime',
  'grep -rn dev0ps knowledge/estate.md',
  'echo "dev0ps is decommissioned"',
]

[[rule]]
id = "ssh-rise3-any"
action = "warn"
regex = '(?i)\bssh\b[^|;&\n]*\brise3\b'
reason = "rise3 is PROD (estate.md): read-only commands are fine; anything that changes state goes through `groundworks run <project> prod ...` after the owner's go (principle 14)."
samples_deny = [
  'ssh rise3 df -h',
  'ssh -t rise3 "microk8s kubectl get pods -A"',
  'ssh root@rise3 journalctl -u snap.microk8s.daemon-kubelite --since "1 hour ago"',
]
samples_allow = [
  'ssh-keygen -l -f ~/.ssh/id_ed25519.pub',
  'grep -rn rise3 knowledge/estate.md',
  'ssh localhost uptime',
]

[[rule]]
id = "ssh-rise3-stdin-script"
action = "deny"
regex = '(?i)(?:\|\s*ssh\b[^|;&\n]*\brise3\b|\bssh\b[^|;&\n]*\brise3\b[^|;&\n]*(?:<<|<\s*(?:[^/\s<&]|/(?:[^d\s]|d[^e\s]|de[^v\s]|dev[^/\s]|dev/[^n\s])))|\bssh\b[^|;&\n]*\brise3\b[^|;&\n]*\b(?:bash|sh|zsh)\s+-s\b)'
reason = "Piping or redirecting a script into ssh rise3 runs unreviewed commands on PROD: put the script in the repo and run it with `groundworks run <project> prod -- bash <script>` after the owner's go."
samples_deny = [
  'cat deploy.sh | ssh rise3 bash',
  'ssh rise3 bash -s < scripts/rotate.sh',
  "ssh rise3 'sudo tee /etc/x' < local.conf",
  'ssh rise3 bash <<EOF',
  "ssh rise3 bash <<'EOF'",
  'echo "kubectl apply -f x" | ssh rise3',
  'ssh rise3 "bash -s" -- arg',
]
samples_allow = [
  'ssh rise3 "cat /etc/hosts" < /dev/null',
  'ssh -n rise3 uptime',
  'ssh rise3 "df -h" | tee df.txt',
  'ssh rise3 "journalctl -u sshd -n 50" | grep -i failed',
  'ssh rise3 "ls -la /var/log"',
]

[[rule]]
id = "ssh-rise3-rm"
action = "deny"
regex = '(?i)\bssh\b[^|;&\n]*\brise3\b.*\b(?:rm\s+(?:-[a-zA-Z]*[rRf][a-zA-Z]*|--recursive|--force)\b|rmdir\s|find\b[^|;&\n]*\s-delete\b|find\b[^|;&\n]*-exec\s+rm\b|shred\b|truncate\s+-s\s*0|:\s*>\s*/|unlink\s)'
reason = "Deleting on PROD is the owner's call (principles 14 and 15): show what and how big first, then `groundworks run <project> prod -- rm ...` after the owner's go."
samples_deny = [
  "ssh rise3 'rm -rf /tmp/build'",
  'ssh rise3 "sudo rm -r /var/lib/docker/tmp"',
  'ssh rise3 rm -f /etc/nginx/conf.d/old.conf',
  'ssh rise3 "find /var/log -name *.gz -delete"',
  "ssh rise3 'find /tmp -mtime +7 -exec rm {} \\;'",
  'ssh rise3 "truncate -s 0 /var/log/syslog"',
]
samples_allow = [
  'ssh rise3 "du -sh /var/lib/docker"',
  'ssh rise3 "find /var/log -name *.gz -mtime +7 | head"',
  'ssh rise3 "ls -la /tmp/build"',
  'rm -rf target/debug',
  'ssh rise3 "docker image ls --format {{.Repository}}"',
]

[[rule]]
id = "ssh-rise3-systemctl"
action = "deny"
regex = '(?i)\bssh\b[^|;&\n]*\brise3\b.*(?:\bsystemctl\b(?:\s+-{1,2}[\w-]+(?:\s*[= ]\s*\S+)?)*\s+(?:restart|stop|start|reload|reload-or-restart|try-restart|disable|enable|mask|unmask|kill|daemon-reload|daemon-reexec|isolate|edit|set-property|revert|reset-failed|poweroff|reboot|halt)\b|\bservice\s+[\w.@-]+\s+(?:restart|stop|start|reload|force-reload)\b)'
reason = "Service lifecycle on PROD is the owner's call (principle 14): check with systemctl status / is-active / journalctl, and restart only via `groundworks run <project> prod -- systemctl restart <unit>` after the owner's go."
samples_deny = [
  'ssh rise3 "sudo systemctl restart snap.microk8s.daemon-kubelite"',
  "ssh rise3 'systemctl stop docker'",
  'ssh rise3 sudo systemctl --no-block restart sshd',
  'ssh rise3 "sudo service ssh restart"',
  'ssh rise3 "sudo systemctl daemon-reload"',
]
samples_allow = [
  'ssh rise3 systemctl is-active snap.microk8s.daemon-kubelite',
  'ssh rise3 "systemctl status docker --no-pager"',
  'ssh rise3 "systemctl list-units --failed"',
  'ssh rise3 "systemctl is-enabled sshd"',
  'ssh rise3 "journalctl -u sshd --since today"',
  'systemctl --user restart gpg-agent',
]

[[rule]]
id = "ssh-rise3-firewall"
action = "deny"
regex = '(?i)\bssh\b[^|;&\n]*\brise3\b.*(?:\b(?:iptables|ip6tables|iptables-restore|ip6tables-restore)\b(?:\s+-{1,2}[\w-]+(?:\s*[= ]\s*\S+)?)*\s+(?:(?-i:-[AIDFPXNERZ])\b|--(?:append|insert|delete|flush|policy|delete-chain|new-chain|rename-chain|replace|zero)\b)|\biptables-restore\b|\bufw\b(?:\s+-{1,2}[\w-]+)*\s+(?:allow|deny|reject|delete|enable|disable|reset|default|limit|insert|prepend|route)\b|\bnft\b(?:\s+-{1,2}[\w-]+)*\s+(?:add|delete|flush|insert|replace|destroy|create|rename|-f\b|--file\b)|\bfirewall-cmd\b[^|;&\n]*--(?:add|remove|set|reload|permanent|new|delete)|\bfail2ban-client\s+(?:stop|unban|set|reload|restart|start)\b)'
reason = "Firewall changes on PROD can lock everyone out and are the owner's call (principle 14): read with iptables -S / ufw status / nft list ruleset, change only via `groundworks run <project> prod ...` after the owner's go."
samples_deny = [
  'ssh rise3 "sudo iptables -A INPUT -p tcp --dport 25 -j ACCEPT"',
  "ssh rise3 'sudo ufw allow 2222/tcp'",
  'ssh rise3 "sudo nft add rule inet filter input tcp dport 8080 accept"',
  'ssh rise3 "sudo ufw disable"',
  'ssh rise3 "sudo iptables -F"',
  'ssh rise3 "sudo iptables-restore < /etc/iptables/rules.v4"',
]
samples_allow = [
  'ssh rise3 "sudo iptables -S"',
  'ssh rise3 "sudo iptables -L -n -v"',
  'ssh rise3 "sudo ufw status verbose"',
  'ssh rise3 "sudo nft list ruleset"',
  'ssh rise3 "sudo fail2ban-client status sshd"',
  'ssh rise3 "sudo iptables -t nat -L -n"',
]

[[rule]]
id = "ssh-rise3-sshd-and-keys"
action = "deny"
regex = '(?i)\bssh\b[^|;&\n]*\brise3\b.*(?:(?:\bsed\s+(?:-[a-zA-Z]*i[a-zA-Z]*|--in-place)\b[^|;&\n]*|>>?\s*|\btee\s+(?:-a\s+)?|\b(?:vi|vim|nvim|nano|ed|ex)\s+|\b(?:cp|mv|install|ln)\s+(?:-\S+\s+)*\S+\s+|\bch(?:mod|own|attr)\s+(?:-\S+\s+)*\S+\s+|\btruncate\b[^|;&\n]*\s)(?:/etc/ssh/sshd_config|/etc/ssh/ssh_config|/etc/ssh/\S*|\S*/\.ssh/authorized_keys\S*|\S*\.ssh/authorized_keys\S*|\S*/\.ssh/\S*|/etc/sudoers\S*|/etc/pam\.d/\S*)|\becho\b[^|;&\n]*\bssh-(?:ed25519|rsa|ecdsa)\b)|\bssh-copy-id\b[^|;&\n]*\brise3\b'
reason = "sshd config, authorized_keys and sudoers ARE the access boundary on PROD; edits lock people out or let them in, and are the owner's call (principle 14): read them with cat / sshd -T, change only via `groundworks run <project> prod ...` after the owner's go."
samples_deny = [
  "ssh rise3 'sudo sed -i \"s/^#PermitRootLogin.*/PermitRootLogin no/\" /etc/ssh/sshd_config'",
  'ssh rise3 "echo ssh-ed25519 AAAAC3Nz... agent@box >> ~/.ssh/authorized_keys"',
  'ssh rise3 "sudo tee /etc/ssh/sshd_config.d/99-hardening.conf"',
  'ssh rise3 "sudo nano /etc/ssh/sshd_config"',
  'ssh rise3 "sudo cp sshd_config.new /etc/ssh/sshd_config"',
  'ssh-copy-id -i ~/.ssh/id_ed25519.pub rise3',
  'ssh rise3 "sudo chmod 600 /root/.ssh/authorized_keys"',
  'ssh rise3 "echo \"deploy ALL=(ALL) NOPASSWD:ALL\" | sudo tee /etc/sudoers.d/deploy"',
]
samples_allow = [
  'ssh rise3 "cat /etc/ssh/sshd_config"',
  'ssh rise3 "sudo sshd -T | grep -i permitrootlogin"',
  'ssh rise3 "grep -n PasswordAuthentication /etc/ssh/sshd_config"',
  'ssh rise3 "cat ~/.ssh/authorized_keys | wc -l"',
  'ssh rise3 "ls -la /etc/ssh/"',
  'ssh rise3 "sudo cat /etc/sudoers.d/deploy"',
  'sed -i "s/foo/bar/" README.md',
]

[[rule]]
id = "ssh-rise3-write-system-path"
action = "deny"
regex = '(?i)\bssh\b[^|;&\n]*\brise3\b.*(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+(?:-[a-zA-Z]*i[a-zA-Z]*|--in-place)\b[^|;&\n]*\s|\b(?:cp|mv|install|ln)\s+(?:-\S+\s+)*\S+\s+|\b(?:vi|vim|nvim|nano)\s+(?:-\S+\s+)*)/(?:etc|usr|var/lib|var/snap|root|home|opt|srv|boot|snap|bin|sbin|lib|lib64)/'
reason = "Writing under /etc, /usr, /var/lib, /root, /home, /opt, /srv or /boot on PROD is a change, not a check (principle 14): write to /tmp to stage, and land it via `groundworks run <project> prod ...` after the owner's go."
samples_deny = [
  'ssh rise3 "echo nameserver 1.1.1.1 | sudo tee /etc/resolv.conf"',
  "ssh rise3 'sudo cp app.service /etc/systemd/system/'",
  'ssh rise3 "sudo sed -i s/x/y/ /etc/hosts"',
  'ssh rise3 "cat cfg > /opt/app/config.toml"',
  'ssh rise3 "sudo mv /tmp/new.conf /etc/nginx/nginx.conf"',
]
samples_allow = [
  'ssh rise3 "cat /etc/hosts"',
  'ssh rise3 "df -h > /tmp/df.txt"',

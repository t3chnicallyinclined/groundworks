[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "groundworks"
version = "0.1.0.dev1"
description = "Evidence-gated knowledge graph built by exhaustive, verified agent reading, viewed through expert lenses."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "t3chnicallyinclined"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.26"]
embed = ["torch", "sentence-transformers>=3", "numpy"]

[project.scripts]
groundworks = "groundworks.cli:main"

[tool.setuptools]
packages = ["groundworks", "groundworks.pipeline", "groundworks.present", "groundworks.panel", "groundworks.mcp", "groundworks.embed", "groundworks.patterns", "groundworks.hooks"]

[tool.setuptools.package-data]
"groundworks.patterns" = ["*.surql"]
"groundworks" = ["skills_templates/*.md"]   # groundworks/skills.py renders these; without them `skills generate` has no templates

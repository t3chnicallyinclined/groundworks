[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xscholar"
version = "0.1.0.dev1"
description = "Evidence-gated knowledge graph built by exhaustive, verified agent reading, viewed through expert lenses."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "t3chnicallyinclined"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.26"]
embed = ["torch", "sentence-transformers>=3", "numpy"]

[project.scripts]
xscholar = "engine.cli:main"

[tool.setuptools]
packages = ["xscholar", "xscholar.pipeline", "xscholar.present", "xscholar.panel", "xscholar.mcp", "xscholar.embed", "xscholar.patterns"]

[tool.setuptools.package-data]
"xscholar.patterns" = ["*.surql"]
